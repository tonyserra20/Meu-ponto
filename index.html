<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Meu Ponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral azul-escura no computador, barra inferior no celular; o cartão de ponto é o elemento central. */
:root{
  --navy:#12294B; --navy-2:#1C3A66; --navy-soft:#E6ECF5;
  --bg:#F4F6FA; --surface:#FFFFFF; --line:#DAE1EB; --ink:#16233A; --muted:#566379;
  --pos:#0F7A54; --pos-soft:#DCF2E6; --neg:#B92D27; --neg-soft:#FBE4E2;
  --ext:#1F5FBF; --ext-soft:#DDE9FB; --off:#5C697B; --off-soft:#E8ECF1; --pend:#7D5900; --pend-soft:#FFF0BC;
  --on-navy:#FFFFFF; --on-navy-2:#B9C8DE;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
h1{font-size:26px;line-height:1.2;font-weight:700;color:var(--navy);text-wrap:balance}
h2{font-size:18px;line-height:1.3;font-weight:600;color:var(--navy);text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ext);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--on-navy);padding:22px 12px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:700;font-size:20px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--on-navy);color:var(--navy);display:grid;place-items:center}
.who{display:block;font-size:13px;font-weight:500;opacity:.8;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;color:var(--on-navy-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--navy-2);color:var(--on-navy)}
.nav a[aria-current=page]{background:var(--on-navy);color:var(--navy);font-weight:600}
.side .out{margin-top:auto}
.side .sync{padding:0 10px;color:var(--on-navy-2)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--pos);flex:none}
.sync.busy i{background:#D9A400}.sync.warn i{background:var(--neg)}
main{min-width:0;padding-block:26px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:none;align-items:center;justify-content:space-between;gap:10px;color:var(--navy);font-weight:700;font-size:19px}
.bottom{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}

.hero{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.hero .date{font-size:17px;color:var(--on-navy-2)}
.hero .date b{color:var(--on-navy);font-weight:600;display:block;font-size:21px}
.hero .date b::first-letter,.cap::first-letter{text-transform:uppercase}
#reminder:empty{display:none}
.clock{font-family:var(--f-num);font-weight:500;font-size:clamp(50px,9vw,72px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:.42em;color:var(--on-navy-2);margin-left:4px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:14px;font-weight:600;background:var(--off-soft);color:var(--off);white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}.pill.extra{background:var(--ext-soft);color:var(--ext)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}.pill.pend{background:var(--pend-soft);color:var(--pend)}
.pill.run{background:var(--navy-soft);color:var(--navy)}
.hero .pill{background:var(--navy-2);color:var(--on-navy)}
.hero .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-navy-2)}
.hero .pill.live::before{background:#5FD6A4}
.punch-main{width:100%;min-height:72px;border:0;border-radius:12px;background:var(--on-navy);color:var(--navy);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;transition:transform .08s}
.punch-main:active{transform:scale(.985)}
.punch-main:disabled{background:var(--navy-2);color:var(--on-navy-2);cursor:default}
.punch-main svg.i{width:28px;height:28px}
.hero a,.linkbtn{background:none;border:0;padding:6px 2px;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.hero .linkbtn{color:var(--on-navy-2)}

/* Cartão de ponto */
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stamp{min-height:112px;background:var(--surface);border:1.5px dashed #AEBBCC;border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;text-align:center;color:var(--muted);line-height:1.15}
.stamp .l{font-size:13px;font-weight:600}
.stamp .t{font-family:var(--f-num);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.stamp .p{font-size:12px}
.stamp.done{border:1.5px solid var(--navy);color:var(--navy);background:var(--navy-soft)}
.stamp.next{border:2px solid var(--navy);color:var(--navy)}
.stamp.skip{opacity:.55}
.stamp:hover{border-color:var(--navy)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:14px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-num);font-size:27px;font-weight:500;line-height:1.2;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--muted)}
.v.pos,.pos{color:var(--pos)!important}.v.neg,.neg{color:var(--neg)!important}
.meter{height:6px;background:var(--navy-soft);border-radius:4px;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--navy);border-radius:4px}

.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--pend-soft);border:1px solid #EAD48A;color:#4D3800;border-radius:var(--r);padding:12px 14px}
.alert>span{display:flex;gap:10px;align-items:center;min-width:0}
.plist{display:flex;flex-direction:column}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}

.btn{min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--navy);background:var(--surface);color:var(--navy);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--navy-soft)}
.btn.primary{background:var(--navy);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}

/* Gráficos */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:150px;align-items:end;position:relative}
.wk .c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;border-radius:4px}
.wk .b{background:var(--navy);border-radius:4px 4px 0 0;min-height:0}
.wk .g{position:absolute;left:12%;right:12%;height:2px;background:var(--muted)}
.wklab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;font-size:13px;text-align:center;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.wklab b{color:var(--navy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:80;background:var(--navy);color:var(--on-navy);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:7px;pointer-events:none;max-width:230px}
.chart svg{display:block;width:100%;touch-action:pan-y}
.chart text{font:12px var(--f-num);fill:var(--muted)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}

/* Calendário */
.calgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;border:1.5px solid transparent;border-radius:8px;background:var(--bg);padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);min-width:0}
.day b{font-weight:600;font-size:17px;line-height:1.1}
.day em{font:500 11px/1.1 var(--f-num);font-style:normal;white-space:nowrap}
.day.ok{background:var(--pos-soft);color:var(--pos)}.day.extra{background:var(--ext-soft);color:var(--ext)}
.day.neg{background:var(--neg-soft);color:var(--neg)}.day.off{background:var(--off-soft);color:var(--off)}
.day.pend{background:var(--pend-soft);color:var(--pend)}
.day.today{border-color:var(--navy)}
.day.sel{box-shadow:0 0 0 2px var(--navy);border-color:var(--surface)}
.day.blank{visibility:hidden}
.iconbtn{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--navy);display:grid;place-items:center}
.iconbtn:hover{background:var(--navy-soft)}
.dl{display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.dl dt{color:var(--muted)}
.dl dd{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.dl .sum{font-weight:600;color:var(--navy)}
.ptimes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.ptimes div{background:var(--bg);border-radius:8px;padding:8px 2px}
.ptimes span{display:block;font-size:12px;color:var(--muted);line-height:1.15}
.ptimes b{font:500 18px var(--f-num)}
.ptimes small{display:block;font-size:11px;color:var(--pend)}
.loglist li{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.loglist li:first-child{border-top:0}
.loglist .chg{font-family:var(--f-num);font-size:13px}

/* Banco */
.bankhero{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.bankhero .big{font:500 clamp(40px,7vw,56px)/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.bankhero .sign-pos{color:#7FE3B8}.bankhero .sign-neg{color:#FFB1AB}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--navy);font-weight:500}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}

/* Formulários e tabela */
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{min-height:48px;width:100%;padding:9px 11px;border:1px solid #B9C4D3;border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--navy);flex:none}
input[type=file]{padding:9px}
textarea{min-height:76px;resize:vertical}
label.ck{display:flex;gap:10px;align-items:center;min-height:40px;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th{font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
td.txt,th.txt{text-align:left;font-family:var(--f-body);white-space:normal;min-width:130px}
tfoot td{font-weight:600;color:var(--navy);border-bottom:0;border-top:2px solid var(--line)}
.sched{display:flex;flex-direction:column;gap:10px}
.schedrow{display:grid;grid-template-columns:128px repeat(4,minmax(0,1fr)) 96px;gap:8px;align-items:center}
.schedrow .tot{font-family:var(--f-num);text-align:right;color:var(--navy)}
.schedhead{font-size:13px;font-weight:600;color:var(--muted)}
.schedhead span:last-child{text-align:right}
.mob-l{display:none}

dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(18,41,75,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg .act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;min-height:18px;color:var(--pend);font-weight:500}
.preview{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px}
.err{color:var(--neg);font-weight:500;font-size:15px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100vw - 32px);font-weight:500}
#toast button{background:none;border:0;color:#9CC4FF;font-weight:700;padding:4px;min-height:32px}
@media (min-width:881px){#toast{bottom:28px}}

@media (max-width:880px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex}
  main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
  .home,.calgrid{grid-template-columns:minmax(0,1fr)}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:8px}
  .bottom a[aria-current=page]{color:var(--navy);background:var(--navy-soft);font-weight:700}
  .schedrow{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 0;border-top:1px solid var(--line)}
  .schedrow.schedhead{display:none}
  .mob-l{display:inline}
  .schedrow .nm{grid-column:1/-1}
  .schedrow .tot{grid-column:1/-1}
}
@media (max-width:520px){
  .stamp{min-height:104px;padding:8px 3px}
  .stamp .t{font-size:18px}
  .stamp .l{font-size:12px}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .stat .v{font-size:24px}
  .punch-main{font-size:20px}
  .hero{padding:18px}
  .cal{gap:3px}
  .day em{font-size:10px;letter-spacing:-.04em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#login{min-height:100%;display:grid;place-items:center;background:var(--navy);padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logbox{background:var(--surface);border-radius:16px;padding:28px 24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.logbox .brand{padding:0;color:var(--navy)}
.logbox .brand .mark{background:var(--navy);color:var(--on-navy)}
.logbox .small{color:var(--muted)}
.google{min-height:56px;width:100%;font-size:18px}
.side .out{color:var(--on-navy-2);padding:0 10px;text-align:left}
</style>
</head><body>

<section id="login" aria-label="Entrar">
  <div class="logbox">
    <div class="brand"><span class="mark" id="loginMark"></span>Meu Ponto</div>
    <h1>Controle de ponto da equipe</h1>
    <p id="loginText">Carregando…</p>
    <form id="loginForm" class="stack" hidden>
      <div class="seg" role="group" aria-label="Acesso"><button type="button" data-act="login-mode" data-m="in" id="mIn" aria-pressed="true">Entrar</button><button type="button" data-act="login-mode" data-m="new" id="mNew" aria-pressed="false">Primeiro acesso</button></div>
      <label class="f">Nome e sobrenome<input id="lg-name" autocomplete="username" autocapitalize="words" required></label>
      <label class="f">Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <label class="f" id="lg-pass2-wrap" hidden>Repita a senha<input id="lg-pass2" type="password" autocomplete="new-password"></label>
      <button class="btn primary google" id="loginBtn">Entrar</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
    <p class="small" id="loginNote" hidden>Cada pessoa vê somente o próprio painel. Esqueceu a senha? Fale com o responsável pelo app.</p>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span class="mark" id="brandMark"></span><span>Meu Ponto<small class="who" id="who1" hidden></small></span></div>
    <nav class="nav" id="nav" aria-label="Menu principal"></nav>
    <button class="linkbtn out" data-act="logout">Sair da conta</button>
    <div class="sync" id="sync1" style="margin-top:0"><i></i><span>Carregando…</span></div>
  </aside>
  <main>
    <div class="wrap">
      <div class="topbar"><span>Meu Ponto<small class="who" id="who2" hidden></small></span><div class="sync" id="sync2"><i></i><span>Carregando…</span></div></div>
      <div id="reminder"></div>
      <div id="view" class="stack"></div>
    </div>
  </main>
  <nav class="bottom" id="bottom" aria-label="Menu principal"></nav>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="ask" aria-labelledby="askTitle"></dialog>
<div id="toast" role="status" hidden></div>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";
/*ENGINE-START*/
const KEYS=['e','ls','lr','x'];
const LABEL={e:'Entrada',ls:'Saída para almoço',lr:'Retorno do almoço',x:'Saída'};
const EVENT_TYPES={
  holiday:'Feriado',dayoff:'Folga',vacation:'Férias',absence_just:'Falta justificada (não desconta)',
  absence:'Falta sem abono (desconta)',comp:'Folga compensada (usa o banco)',adjust:'Ajuste de saldo'
};
const EVENT_SHORT={holiday:'Feriado',dayoff:'Folga',vacation:'Férias',absence_just:'Falta justificada',absence:'Falta',comp:'Folga compensada'};
const ZERO_EXPECTED=['holiday','dayoff','vacation','absence_just'];
const EVENT_PRIORITY=['holiday','vacation','dayoff','absence_just','comp','absence'];
const DEFAULT_WEEK={
  0:null,
  1:{e:'08:00',ls:'12:00',lr:'14:00',x:'18:00'},2:{e:'08:00',ls:'12:00',lr:'14:00',x:'18:00'},
  3:{e:'08:00',ls:'12:00',lr:'14:00',x:'18:00'},4:{e:'08:00',ls:'12:00',lr:'14:00',x:'18:00'},
  5:{e:'08:00',ls:'12:00',lr:'14:00',x:'18:00'},6:{e:'08:00',ls:'',lr:'',x:'12:00'}
};
const DAY=1440;
function clone(o){return JSON.parse(JSON.stringify(o))}
function defaultCfg(today){return {
  v:1,start:today,initial:0,tz:'America/Sao_Paulo',
  versions:[{from:'2000-01-01',week:clone(DEFAULT_WEEK)}],
  remind:{on:true,after:5}
}}
function hm2m(s){return (+s.slice(0,2))*60+(+s.slice(3,5))}
function d2u(iso){const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)}
function u2d(ms){return new Date(ms).toISOString().slice(0,10)}
function addDays(iso,n){return u2d(d2u(iso)+n*864e5)}
function diffDays(a,b){return Math.round((d2u(b)-d2u(a))/864e5)}
function dow(iso){return new Date(d2u(iso)).getUTCDay()}
function mondayOf(iso){return addDays(iso,-((dow(iso)+6)%7))}
function monthEnd(ym){const [y,m]=ym.split('-').map(Number);return u2d(Date.UTC(y,m,0))}
function fmtDur(min){const a=Math.abs(min);return Math.floor(a/60)+'h'+String(a%60).padStart(2,'0')}
function fmtSigned(min){return min===0?'0h00':(min>0?'+':'−')+fmtDur(min)}

/* Converte uma sequência HH:MM em minutos absolutos. Cada horário menor que o anterior passou da meia-noite. */
function seqAbs(times){
  const out={};let off=0,prev=null;
  for(const [k,t] of times){
    if(!t)continue;
    let m=hm2m(t)+off;
    if(prev!==null&&m<prev){off+=DAY;m+=DAY}
    out[k]=m;prev=m;
  }
  return out;
}
function schedAbs(s){return seqAbs(KEYS.map(k=>[k,s[k]]))}
function schedMinutes(s){
  if(!s)return 0;
  const a=schedAbs(s);
  return s.ls&&s.lr?(a.ls-a.e)+(a.x-a.lr):a.x-a.e;
}
function weekFor(cfg,date){
  const list=cfg.versions.slice().sort((a,b)=>a.from<b.from?-1:1);
  let w=list[0];
  for(const v of list)if(v.from<=date)w=v;
  return w.week;
}
function schedFor(cfg,date){return weekFor(cfg,date)[dow(date)]||null}
function eventFor(events,date){
  const hit=events.filter(e=>e.type!=='adjust'&&e.from<=date&&date<=(e.to||e.from));
  hit.sort((a,b)=>EVENT_PRIORITY.indexOf(a.type)-EVENT_PRIORITY.indexOf(b.type));
  return hit[0]||null;
}
function punchesOf(rec){return (rec&&rec.p)||{}}
function hasAny(rec){return KEYS.some(k=>punchesOf(rec)[k])}
function absOf(rec){const p=punchesOf(rec);return seqAbs(KEYS.map(k=>[k,p[k]&&p[k].t]))}

/* Dia ao qual o próximo registro pertence. Um expediente aberto ontem continua se o último registro tem menos de 12 h. */
function activeDate(getDay,now){
  const today=getDay(now.date);
  if(hasAny(today))return now.date;
  const y=addDays(now.date,-1),r=getDay(y),p=punchesOf(r);
  if(p.e&&!p.x){
    const a=absOf(r),last=Math.max(...Object.values(a)),gone=now.min+DAY-last;
    if(gone>=0&&gone<720)return y;
  }
  return now.date;
}

function computeDay(date,ctx){
  const {cfg,events,now}=ctx,rec=ctx.getDay(date)||{},p=punchesOf(rec);
  const sched=schedFor(cfg,date),ev=eventFor(events,date);
  const zero=ev&&ZERO_EXPECTED.includes(ev.type);
  const expected=zero?0:schedMinutes(sched);
  const any=hasAny(rec);
  const future=date>now.date;
  const active=ctx.active||now.date;
  const missing=[];
  const abs=absOf(rec);
  const res={date,sched,ev,expected,worked:0,delta:0,extra:0,neg:0,comp:0,late:0,early:0,status:'none',label:'',missing,counted:false,inProgress:false,abs,warn:'',any,rec};
  const nextDay={};
  if(any){
    const first=Math.min(...Object.values(abs));
    const base=Math.floor(first/DAY);
    for(const k of KEYS)if(abs[k]!==undefined&&Math.floor(abs[k]/DAY)>base)nextDay[k]=true;
  }
  res.nextDay=nextDay;

  if(any){
    if(!p.e)missing.push('e');
    if(!p.x)missing.push('x');
    if(p.ls&&!p.lr)missing.push('lr');
    if(p.lr&&!p.ls)missing.push('ls');
    if(!p.ls&&!p.lr&&sched&&sched.ls&&!zero&&!rec.noLunch&&(p.e||p.x)){missing.push('ls');missing.push('lr')}
    let w=0;
    if(p.e&&p.ls)w+=abs.ls-abs.e;
    if(p.lr&&p.x)w+=abs.x-abs.lr;
    if(p.e&&p.x&&!p.ls&&!p.lr)w+=abs.x-abs.e;
    const inProg=(date===now.date||date===active)&&!p.x;
    if(inProg&&!future){
      res.inProgress=true;
      const nowAbs=now.min+DAY*Math.max(0,diffDays(date,now.date));
      if(p.e&&!p.ls&&!p.lr)w+=Math.max(0,nowAbs-abs.e);
      else if(p.lr)w+=Math.max(0,nowAbs-abs.lr);
    }
    res.worked=w;
    if(sched&&!zero){
      const s=schedAbs(sched);
      if(p.e)res.late+=Math.max(0,abs.e-s.e);
      if(p.ls&&p.lr&&sched.ls)res.late+=Math.max(0,(abs.lr-abs.ls)-(s.lr-s.ls));
      if(p.x)res.early+=Math.max(0,s.x-abs.x);
    }
    const vals=Object.values(abs);
    if(vals.length>1&&Math.max(...vals)-Math.min(...vals)>=960)res.warn='Jornada acima de 16 horas. Confira os horários.';
  }
  res.delta=res.worked-expected;

  const compensating=(ev&&ev.type==='comp')||rec.comp;
  function settle(){
    res.counted=true;
    res.extra=Math.max(res.delta,0);
    const short=Math.max(-res.delta,0);
    if(compensating)res.comp=short;else res.neg=short;
  }

  if(any){
    if(res.inProgress){res.status='run';res.label='Em andamento'}
    else if(missing.length){res.status='pend';res.label='Registro pendente';res.delta=0}
    else{
      settle();
      if(ev&&ev.type==='comp'){res.status='off';res.label='Folga compensada'}
      else if(res.delta>0){res.status='extra';res.label='Horas extras'}
      else if(res.delta<0){res.status='neg';res.label=rec.comp?'Compensado no banco':'Horas negativas'}
      else if(expected===0){res.status='off';res.label=ev?EVENT_SHORT[ev.type]:'Folga'}
      else{res.status='ok';res.label='Jornada cumprida'}
    }
    return res;
  }
  if(ev){
    res.label=ev.note||EVENT_SHORT[ev.type];
    if(future){res.status=(ev.type==='absence')?'none':'off';res.delta=0;return res}
    if(ev.type==='absence'){settle();res.status='neg';res.label=ev.note?('Falta: '+ev.note):'Falta';return res}
    if(ev.type==='comp'){settle();res.status='off';return res}
    res.status='off';res.delta=0;res.counted=true;return res;
  }
  res.delta=0;
  if(!sched){res.status='off';res.label='Folga';return res}
  if(future||date<cfg.start){res.status='none';return res}
  if(date===now.date){res.status='wait';res.label='Aguardando entrada';return res}
  res.status='pend';res.label='Sem registros';missing.push(...KEYS.filter(k=>sched[k]));
  return res;
}

function buildLedger(ctx,dayDates){
  const {cfg,events,now}=ctx;
  let first=cfg.start;
  for(const d of dayDates)if(d<first)first=d;
  for(const e of events)if(e.type==='adjust'&&e.from<first)first=e.from;
  const rows=[],map=new Map();
  let bal=cfg.initial||0;
  for(let d=first;d<=now.date;d=addDays(d,1)){
    const c=computeDay(d,ctx);
    const adj=events.filter(e=>e.type==='adjust'&&e.from===d).reduce((s,e)=>s+e.min,0);
    if(d===first)c.isFirst=true;
    bal+=adj+(c.counted?c.delta:0);
    c.adj=adj;c.bal=bal;
    rows.push(c);map.set(d,c);
  }
  return {rows,map,first,balance:bal};
}
function summarize(rows,initial){
  const t={worked:0,expected:0,extra:0,neg:0,comp:0,late:0,early:0,pos:0,negTotal:0,pend:0,net:0};
  if(initial>0)t.pos+=initial;
  if(initial<0)t.negTotal+=-initial;
  if(initial)t.net+=initial;
  for(const c of rows){
    t.worked+=c.worked;t.late+=c.late;t.early+=c.early;
    if(c.status!=='none')t.expected+=c.expected;
    t.extra+=c.extra;t.neg+=c.neg;t.comp+=c.comp;
    t.pos+=c.extra;t.negTotal+=c.neg;
    if(c.adj>0)t.pos+=c.adj;
    if(c.adj<0)t.negTotal+=-c.adj;
    if(c.status==='pend')t.pend++;
    t.net+=(c.adj||0)+(c.counted?c.delta:0);
  }
  return t;
}
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return u2d(Date.UTC(y,mo-1,da));
}
function nationalHolidays(y){
  return [['01-01','Confraternização Universal'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência do Brasil'],
   ['10-12','Nossa Senhora Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Consciência Negra'],['12-25','Natal']]
   .map(([d,n])=>({date:y+'-'+d,name:n})).concat([{date:addDays(easter(y),-2),name:'Sexta-feira Santa'}]).sort((a,b)=>a.date<b.date?-1:1);
}

const OLD_CACHE='meu-ponto-v1';
const Store={docs:{},pending:{},col:null,mode:'init',flushing:false,retry:0,definitive:false,timer:null,issue:'',ready:false,unsub:null,user:{id:null,name:'',owner:false}};
function cacheKey(){return 'meu-ponto-v2-'+(Store.user.id||'anon')}
function cacheRead(){try{const r=JSON.parse(localStorage.getItem(cacheKey())||'null');if(r){Store.docs=r.docs||{};Store.pending=r.pending||{};version++}}catch(e){}}
function cacheWrite(){if(!Store.ready)return;try{localStorage.setItem(cacheKey(),JSON.stringify({docs:Store.docs,pending:Store.pending}))}catch(e){}}
/* Registros da versão individual que ainda não tinham sido enviados pertencem ao dono do app. */
function adoptOldCache(){
  try{
    const r=JSON.parse(localStorage.getItem(OLD_CACHE)||'null');
    if(!r)return;
    if(Store.user.owner){
      for(const [id,v] of Object.entries(r.pending||{})){if(!(id in Store.pending)){Store.pending[id]=v;if(v===null)delete Store.docs[id];else Store.docs[id]=v}}
      version++;
    }
    localStorage.removeItem(OLD_CACHE);
  }catch(e){}
}
function goLocal(){
  if(Store.unsub){try{Store.unsub()}catch(e){}Store.unsub=null}
  clearTimeout(Store.timer);Store.col=null;Store.mode='local';
  ensureCfg();syncBadge();
}
function put(id,data){const d=clone(data);Store.docs[id]=d;Store.pending[id]=d;cacheWrite();flush();version++}
function drop(id){delete Store.docs[id];Store.pending[id]=null;cacheWrite();flush();version++}
async function flush(){
  syncBadge();
  if(Store.flushing||!Store.col)return;
  Store.flushing=true;
  try{
    for(;;){
      const ids=Object.keys(Store.pending);
      if(!ids.length)break;
      const id=ids[0],val=Store.pending[id],mark=JSON.stringify(val);
      try{
        if(val===null)await Store.col.doc(id).delete();else await Store.col.doc(id).set(val);
        if(JSON.stringify(Store.pending[id])===mark)delete Store.pending[id];
        cacheWrite();Store.retry=0;Store.issue='';
      }catch(e){
        const c=e&&e.code;
        if(c==='resource-exhausted'){Store.issue='Limite diário do banco de dados atingido. Seus dados continuam neste aparelho e serão enviados depois.';setTimeout(flush,600000);break}
        if(c==='permission-denied'||c==='unauthenticated'||c==='invalid-argument'){goLocal();setTimeout(()=>render(true),0);break}
        Store.issue='';Store.retry++;
        setTimeout(flush,Math.min(30000,1500*Math.pow(2,Store.retry)));
        break;
      }
    }
  }finally{Store.flushing=false;syncBadge()}
}
function syncBadge(){
  const n=Object.keys(Store.pending).length;
  let cls='',txt='Dados salvos';
  if(Store.mode==='init'){cls='busy';txt='Conectando…'}
  else if(Store.issue){cls='warn';txt='Salvo só neste aparelho'}
  else if(Store.mode==='local'){cls='warn';txt='Salvo só neste aparelho'}
  else if(n){cls='busy';txt=navigator.onLine===false?'Sem internet: salvo no aparelho':'Salvando…'}
  for(const id of ['sync1','sync2']){const el=document.getElementById(id);el.className='sync '+cls;el.lastElementChild.textContent=txt}
}
function applySnapshot(snap){
  let changed=false;
  const incoming={};
  snap.docs.forEach(d=>{if(d.exists)incoming[d.id]=clone(d.data())});
  const definitive=!snap.metadata||!snap.metadata.fromCache;
  const next=definitive?{}:clone(Store.docs);
  Object.assign(next,incoming);
  for(const [id,v] of Object.entries(Store.pending)){if(v===null)delete next[id];else next[id]=v}
  if(JSON.stringify(sortObj(next))!==JSON.stringify(sortObj(Store.docs)))changed=true;
  Store.docs=next;
  if(definitive){
    Store.definitive=true;clearTimeout(Store.timer);Store.mode='cloud';
    ensureCfg();
  }
  if(changed){cacheWrite();version++;render(true)}
  syncBadge();flush();
}
function sortObj(o){const r={};Object.keys(o).sort().forEach(k=>r[k]=o[k]);return r}

}

function ctx(){const n=now(),base={cfg:cfg(),events:events(),now:n,getDay};base.active=activeDate(getDay,n);return base}

function nextKey(date,c){
  const rec=getDay(date)||{},p=punchesOf(rec);
  if(p.x)return null;
  const sched=c.sched,zero=c.ev&&ZERO_EXPECTED.includes(c.ev.type);
  const useLunch=sched&&sched.ls&&!zero&&!rec.noLunch;
  const seq=(useLunch||p.ls)?KEYS:['e','x'];
  return seq.find(k=>!p[k]);
}
function dayStatusText(c){
  const p=punchesOf(c.rec);
  if(p.x)return ['Expediente encerrado',false];
  if(p.ls&&!p.lr)return ['Em horário de almoço',false];
  if(p.e||p.lr)return ['Em expediente',true];
  if(c.ev)return [EVENT_SHORT[c.ev.type]+(c.ev.note?': '+c.ev.note:''),false];
  if(!c.sched)return ['Folga',false];
  return ['Aguardando entrada',false];
}

  const wkT=wk.reduce((s,r)=>s+r.worked,0);
  const wkE=wk.reduce((s,r)=>s+r.expected,0);
  const moW=led.rows.filter(r=>r.date.startsWith(ym)).reduce((s,r)=>s+r.worked,0);

    <div class="stats">

      <div class="stat"><span class="k">Meta diária</span><span class="v">${fmtDur(c.expected)}</span><span class="s">${c.sched&&c.expected?esc(c.sched.e)+' às '+esc(c.sched.x):'Sem jornada hoje'}</span></div>
      <div class="stat"><span class="k">Saldo do dia</span><span class="v ${dayCls}">${dayVal}</span><span class="s">${esc(daySub)}</span></div>
      <div class="stat"><span class="k">Saldo do mês</span><span class="v ${signClass(mo.net)}">${fmtSigned(mo.net)}</span><span class="s">Dias concluídos</span></div>

function tzLabel(){return {'America/Sao_Paulo':'Horário de Brasília','America/Manaus':'Horário de Manaus','America/Rio_Branco':'Horário do Acre','America/Noronha':'Horário de Fernando de Noronha'}[cfg().tz]||cfg().tz}

let lastPunch=0;
function punch(key){
  if(!key||!Store.ready)return;
  const t=Date.now();
  if(t-lastPunch<3000){toast('Aguarde um instante: o registro anterior acabou de ser feito.');return}
  const x=ctx(),date=x.active,rec=clone(getDay(date)||{date,p:{}});
  rec.p=rec.p||{};
  if(rec.p[key])return;
  if(KEYS.slice(KEYS.indexOf(key)+1).some(k=>rec.p[k])){
    editDay(date);toast('Já existe um registro posterior. Informe este horário aqui.');return;
  }
  lastPunch=t;
  const prev=clone(rec);
  rec.p[key]={t:x.now.hm,at:isoNow(),src:'auto'};
  rec.u=isoNow();
  put('d_'+date,rec);
  addLog({date,what:'Registro automático',field:LABEL[key],before:'',after:x.now.hm,reason:''});
  render();
  toast(LABEL[key]+' registrada às '+x.now.hm,{label:'Desfazer',fn(){
    put('d_'+date,prev);
    addLog({date,what:'Registro desfeito',field:LABEL[key],before:x.now.hm,after:'',reason:'Desfeito logo após o registro'});
    lastPunch=0;render();toast('Registro desfeito.');
  }});
}

    <label class="f">Motivo da alteração (obrigatório ao mudar um horário já registrado)<input id="ed-reason" autocomplete="off"></label>
    <div class="err" id="edErr" role="alert"></div>
    <div class="act"><button type="button" class="btn" data-act="close-dlg">Cancelar</button><button class="btn primary">Salvar</button></div>
  </form>`;
  d.showModal();

}
function draftFromForm(date){
  const base=clone(getDay(date)||{date,p:{}});
  base.p=base.p||{};
  for(const k of KEYS){
    const v=$('#ed-'+k).value;
    if(v)base.p[k]=Object.assign({},base.p[k]||{}, {t:v});else delete base.p[k];
  }
  base.noLunch=$('#ed-nolunch').checked;
  base.comp=$('#ed-comp').checked;
  return base;
}
function previewEdit(){
  const date=$('#edForm').dataset.date,draft=draftFromForm(date),x=ctx();
  const c=computeDay(date,Object.assign({},x,{getDay:d=>d===date?draft:getDay(d)}));
  for(const k of KEYS)$('#hint-'+k).textContent=c.nextDay[k]?'Dia seguinte (passou da meia-noite)':'';
  let t='Total <b class="num">'+fmtDur(c.worked)+'</b> · Previsto <b class="num">'+fmtDur(c.expected)+'</b>';
  if(c.counted)t+=' · Saldo <b class="num '+signClass(c.delta)+'">'+fmtSigned(c.delta)+'</b>';
  else if(c.status==='pend')t+=' · <span style="color:var(--pend)">Falta '+c.missing.map(k=>LABEL[k].toLowerCase()).join(', ')+'</span>';
  if(c.warn)t+='<br><span class="neg">'+esc(c.warn)+'</span>';
  $('#edPrev').innerHTML=t;
  return c;
}
function saveEdit(){
  const date=$('#edForm').dataset.date,old=clone(getDay(date)||{date,p:{}}),oldP=old.p||{};
  const c=previewEdit(),reason=$('#ed-reason').value.trim(),err=$('#edErr');
  const vals=Object.values(c.abs);
  if(vals.length>1&&Math.max(...vals)-Math.min(...vals)>=DAY){err.textContent='Os horários somam 24 horas ou mais. Confira a ordem: entrada, saída para almoço, retorno e saída.';return}
  if(vals.length){
    const x=ctx(),nowAbs=x.now.min+DAY*diffDays(date,x.now.date);
    if(Math.max(...vals)>nowAbs){err.textContent='Há um horário no futuro. Confira os valores informados.';return}
  }
  const logs=[],rec=clone(old);rec.date=date;rec.p=rec.p||{};
  for(const k of KEYS){
    const nv=$('#ed-'+k).value,ov=oldP[k]?oldP[k].t:'';
    if(nv===ov)continue;
    if(ov&&!reason){err.textContent='Informe o motivo da alteração de '+LABEL[k].toLowerCase()+'.';$('#ed-reason').focus();return}
    if(nv)rec.p[k]={t:nv,at:isoNow(),src:'manual'};else delete rec.p[k];
    logs.push({date,what:ov?(nv?'Horário corrigido':'Horário removido'):'Inclusão manual',field:LABEL[k],before:ov,after:nv,reason});
  }
  const just=$('#ed-just').value.trim(),nl=$('#ed-nolunch').checked,cp=$('#ed-comp').checked;
  if(just!==(old.just||'')){rec.just=just;logs.push({date,what:'Justificativa alterada',field:'',before:old.just||'',after:just,reason})}
  if(nl!==!!old.noLunch){rec.noLunch=nl;logs.push({date,what:nl?'Marcado sem almoço':'Removida marcação sem almoço',field:'',before:'',after:'',reason})}
  if(cp!==!!old.comp){rec.comp=cp;logs.push({date,what:cp?'Compensação pelo banco marcada':'Compensação pelo banco removida',field:'',before:'',after:'',reason})}
  $('#dlg').close();
  if(!logs.length)return;
  rec.u=isoNow();
  put('d_'+date,rec);addLog(logs);
  render();toast('Alterações salvas.');
}

function bankRange(){

  if(b.k==='tudo')return [led.first,n];

}

let bankPts=[];
function drawBankChart(){
  const box=$('#bankChart');if(!box)return;
  const led=ledger(),[from,to]=bankRange();
  const rows=led.rows.filter(r=>r.date>=from&&r.date<=to);
  if(rows.length<2){box.innerHTML='<div class="empty">O gráfico aparece depois do segundo dia no período.</div>';return}
  const W=Math.max(280,box.clientWidth),H=230,L=58,R=14,T=14,B=28,pw=W-L-R,ph=H-T-B;
  const vals=rows.map(r=>r.bal);
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);
  if(lo===hi)hi=60;
  const span=hi-lo,steps=[60,120,240,480,600,1200,2400,4800,9600,19200];
  const step=steps.find(s=>span/s<=4)||steps[steps.length-1];
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const y=v=>T+(hi-v)/(hi-lo)*ph,x=i=>L+i/(rows.length-1)*pw;
  let grid='';
  for(let v=lo;v<=hi;v+=step){
    grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===0?'#8693A6':'#E3E8EF')+'" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v===0?'0h':(v>0?'+':'−')+Math.abs(v/60)+'h')+'</text>';
  }
  let path='M'+x(0)+' '+y(vals[0]);
  for(let i=1;i<vals.length;i++)path+=' H'+x(i)+' V'+y(vals[i]);
  const area=path+' H'+x(vals.length-1)+' V'+y(0)+' H'+x(0)+' Z';
  const zy=y(0);
  const lab=(i,a)=>'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="'+a+'">'+shortDate(rows[i].date)+'</text>';
  const mid=Math.floor(rows.length/2);
  const last=vals.length-1;
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Evolução do saldo do banco de horas. Saldo final '+fmtSigned(vals[last])+'.">'+
   '<defs><clipPath id="cp"><rect x="0" y="0" width="'+W+'" height="'+zy+'"/></clipPath><clipPath id="cn"><rect x="0" y="'+zy+'" width="'+W+'" height="'+(H-zy)+'"/></clipPath></defs>'+grid+
   '<path d="'+area+'" fill="#DCF2E6" clip-path="url(#cp)"/><path d="'+area+'" fill="#FBE4E2" clip-path="url(#cn)"/>'+
   '<path d="'+path+'" fill="none" stroke="#12294B" stroke-width="2"/>'+
   '<circle cx="'+x(last)+'" cy="'+y(vals[last])+'" r="5" fill="#12294B" stroke="#fff" stroke-width="2"/>'+
   lab(0,'start')+(rows.length>4?lab(mid,'middle'):'')+lab(last,'end')+
   '<line id="cross" x1="0" x2="0" y1="'+T+'" y2="'+(T+ph)+'" stroke="#566379" stroke-dasharray="3 3" visibility="hidden"/>'+
   '<rect id="hit" x="'+L+'" y="0" width="'+pw+'" height="'+H+'" fill="transparent"/></svg>';
  bankPts=rows.map((r,i)=>({x:x(i),r}));
  const hit=$('#hit',box),cross=$('#cross',box);
  const move=e=>{
    const b=box.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*W;
    let best=bankPts[0];for(const p of bankPts)if(Math.abs(p.x-px)<Math.abs(best.x-px))best=p;
    cross.setAttribute('x1',best.x);cross.setAttribute('x2',best.x);cross.setAttribute('visibility','visible');
    showTip(e.clientX,b.top+10,'<b>'+brDate(best.r.date)+'</b><br>Saldo: '+fmtSigned(best.r.bal)+'<br>No dia: '+(best.r.counted?fmtSigned(best.r.delta):'—'));
  };
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{cross.setAttribute('visibility','hidden');hideTip()});
}

function repRange(){
  const n=now().date,r=S.rep;
  if(r.type==='dia'){const d=r.day||n;return [d,d]}
  if(r.type==='sem'){const m=mondayOf(r.day||n);return [m,addDays(m,6)]}
  if(r.type==='mes'){const y=r.month||n.slice(0,7);return [y+'-01',monthEnd(y)]}
  return [r.from||n.slice(0,7)+'-01',r.to||n];
}
function repRows(){
  const [from,to]=repRange(),x=ctx(),led=ledger(),rows=[];
  if(from>to||diffDays(from,to)>1830)return {from,to,rows,t:summarize([],0)};
  for(let d=from;d<=to;d=addDays(d,1))rows.push(led.map.get(d)||computeDay(d,x));
  return {from,to,rows,t:summarize(rows.filter(r=>r.date<=x.now.date),0)};
}
function repExp(c){return (c.status==='none'||c.date>now().date)?0:c.expected}
function repCell(c,k){const p=punchesOf(c.rec)[k];return p?p.t+(c.nextDay[k]?' (+1)':''):''}
function repObs(c){
  const a=[];
  if(c.status==='pend')a.push(c.any?'Pendente':'Sem registros');
  if(c.ev)a.push(EVENT_SHORT[c.ev.type]+(c.ev.note?': '+c.ev.note:''));
  if(c.comp&&!(c.ev&&c.ev.type==='comp'))a.push('Compensado no banco');
  if(c.rec&&c.rec.just)a.push(c.rec.just);
  return a.join(' · ');
}

async function saveFile(filename,data){

  const url=URL.createObjectURL(new Blob([data],{type:types[filename.split('.').pop()]||'application/octet-stream'}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();

}

function fileStamp(R){return R.from===R.to?R.from:R.from+'_a_'+R.to}
function pdfSafe(s){return String(s).replace(/−/g,'-').replace(/–/g,'-').replace(/→/g,'>').replace(/·/g,'|').replace(/[^\x20-\x7E -ÿ]/g,'?')}
async function exportPDF(){
  if(!window.PDFLib){toast('O gerador de PDF ainda não carregou. Verifique a internet e tente de novo.');return}

  if(!R.rows.length){toast('Período inválido. Confira as datas.');return}

  const cols=[['Data',62,'l'],['Entrada',48,'c'],['Saída almoço',70,'c'],['Retorno',48,'c'],['Saída',48,'c'],['Total',46,'r'],['Prevista',48,'r'],['Extras',46,'r'],['Negativas',54,'r'],['Saldo dia',52,'r'],['Acumulado',60,'r'],['Observação',0,'l']];
  const used=cols.reduce((s,c)=>s+c[1],0);cols[11][1]=W-2*M-used;
  const rowH=18;let page,y,pageNo=0;
  const txt=(p,s,x,yy,o)=>p.drawText(pdfSafe(s),Object.assign({x,y:yy,size:9,font,color:ink},o||{}));
  function cell(p,val,col,x,yy,f,color){
    let s=pdfSafe(val),max=col[1]-8;
    while(s&&f.widthOfTextAtSize(s,8.5)>max)s=s.slice(0,-1);
    const w=f.widthOfTextAtSize(s,8.5);
    const px=col[2]==='l'?x+4:col[2]==='c'?x+(col[1]-w)/2:x+col[1]-w-4;
    p.drawText(s,{x:px,y:yy,size:8.5,font:f,color});
  }
  function header(){
    page=pdf.addPage([W,H]);pageNo++;y=H-M;
    page.drawText('Meu Ponto',{x:M,y:y-14,size:18,font:bold,color:navy});
    txt(page,(Store.user.name?Store.user.name+' | ':'')+'Relatório de '+brDate(R.from)+' a '+brDate(R.to),M,y-30,{size:10,color:mut});
    const g='Gerado em '+brDateTime(isoNow());
    txt(page,g,W-M-font.widthOfTextAtSize(pdfSafe(g),9),y-14,{color:mut});
    y-=52;
    page.drawRectangle({x:M,y:y-5,width:W-2*M,height:rowH,color:navy});
    let cx=M;for(const c of cols){cell(page,c[0],c,cx,y,bold,rgb(1,1,1));cx+=c[1]}
    y-=rowH;
  }
  header();
  R.rows.forEach((c,i)=>{
    if(y<M+40){footer();header()}
    if(i%2)page.drawRectangle({x:M,y:y-5,width:W-2*M,height:rowH,color:zebra});
    const v=[shortDate(c.date)+' '+WDS[dow(c.date)],...KEYS.map(k=>repCell(c,k)||'-'),fmtDur(c.worked),fmtDur(repExp(c)),fmtDur(c.extra),fmtDur(c.neg+c.comp),c.counted?fmtSigned(c.delta):'-',c.bal!==undefined?fmtSigned(c.bal):'-',repObs(c)];
    let cx=M;v.forEach((s,j)=>{cell(page,s,cols[j],cx,y,font,ink);cx+=cols[j][1]});
    y-=rowH;
  });
  if(y<M+40){footer();header()}
  page.drawLine({start:{x:M,y:y+13},end:{x:W-M,y:y+13},thickness:1,color:line});
  const tot=['Total','','','','',fmtDur(R.t.worked),fmtDur(R.t.expected),fmtDur(R.t.extra),fmtDur(R.t.neg+R.t.comp),fmtSigned(R.t.net),'',''];
  let cx=M;tot.forEach((s,j)=>{if(s)cell(page,s,cols[j],cx,y,bold,navy);cx+=cols[j][1]});
  footer();
  function footer(){txt(page,'Página '+pageNo,W-M-40,16,{size:8,color:mut});txt(page,'Dias pendentes não entram no saldo. (+1) indica horário no dia seguinte.',M,16,{size:8,color:mut})}
  const bytes=await pdf.save();

/* Excel: gera o .xlsx diretamente (ZIP sem compressão), sem depender de internet */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];
  for(const [name,content] of files){
    const nb=enc.encode(name),db=enc.encode(content),crc=crc32(db);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
    const local=new Uint8Array([0x50,0x4B,3,4,...common]);
    parts.push(local,nb,db);
    central.push(new Uint8Array([0x50,0x4B,1,2,...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=local.length+nb.length+db.length;
  }
  const cdSize=central.reduce((s,a)=>s+a.length,0);
  const end=new Uint8Array([0x50,0x4B,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),0,0]);
  const all=[...parts,...central,end],out=new Uint8Array(all.reduce((s,a)=>s+a.length,0));
  let p=0;for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
function buildXlsx(R){

  rowsXml+='<row r="3">'+heads.map((h,i)=>str(3,i,h,1)).join('')+'</row>';
  let r=4;

  const widths=[12,15,9,13,14,9,15,15,12,14,12,14,42];

  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="[h]:mm"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FF12294B"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF12294B"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="3" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  return zipStore([

    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Relatório" sheetId="1" r:id="rId1"/></sheets></workbook>'],

    ['xl/styles.xml',styles],

  ]);

function saveEvent(){
  const t=$('#ev-type').value,from=$('#ev-from').value,toEl=$('#ev-to'),to=toEl&&toEl.value?toEl.value:from,note=$('#ev-note').value.trim(),err=$('#evErr');
  if(!from){err.textContent='Informe a data.';return}
  if(to<from){err.textContent='A data final não pode ser anterior à inicial.';return}
  const e={id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:t,from,to,note};
  if(t==='adjust'){
    const m=(+$('#ev-h').value||0)*60+(+$('#ev-m').value||0);
    if(!m){err.textContent='Informe as horas do ajuste.';return}
    e.min=m*(+$('#ev-sign').value);
  }
  const list=events().concat(e);
  put('events',{list});
  addLog({date:from,what:'Ocorrência incluída',field:EVENT_TYPES[t],before:'',after:(t==='adjust'?fmtSigned(e.min):(to!==from?brDate(from)+' a '+brDate(to):brDate(from))),reason:note});
  S.evFrom='';render();toast('Ocorrência salva.');
}
async function delEvent(id){
  const e=events().find(x=>x.id===id);if(!e)return;
  if(!await ask('Remover ocorrência?','O saldo será recalculado. A remoção fica no histórico.','Remover',true))return;
  put('events',{list:events().filter(x=>x.id!==id)});
  addLog({date:e.from,what:'Ocorrência removida',field:EVENT_TYPES[e.type],before:brDate(e.from)+(e.note?' '+e.note:''),after:'',reason:''});
  render();
}
function addHolidays(y){
  const cur=events(),add=nationalHolidays(+y).filter(h=>!cur.some(e=>e.type==='holiday'&&e.from===h.date)).map((h,i)=>({id:'h'+h.date,type:'holiday',from:h.date,to:h.date,note:h.name}));
  if(!add.length){toast('Os feriados nacionais de '+y+' já estão cadastrados.');return}
  put('events',{list:cur.concat(add)});
  addLog({date:now().date,what:'Feriados nacionais incluídos',field:y,before:'',after:add.length+' feriados',reason:''});
  render();toast(add.length+' feriados incluídos.');
}

function readWeekForm(){
  const w={};
  for(const d of [0,1,2,3,4,5,6]){
    if(!$('#w-'+d+'-on').checked){w[d]=null;continue}
    w[d]={};for(const k of KEYS)w[d][k]=$('#w-'+d+'-'+k).value;
  }
  return w;
}
function updateWeekTotal(){
  const w=readWeekForm();let tot=0;
  for(const d of [0,1,2,3,4,5,6]){
    let m=0;
    if(w[d]&&w[d].e&&w[d].x&&(!!w[d].ls===!!w[d].lr))m=schedMinutes(w[d]);
    tot+=m;$('#t-'+d).textContent=w[d]?fmtDur(m):'Folga';
    for(const k of KEYS)$('#w-'+d+'-'+k).disabled=!w[d];
  }
  $('#weekTotal').textContent=fmtDur(tot);

function saveWeek(){
  const w=readWeekForm(),from=$('#w-from').value,err=$('#wErr');
  if(!from){err.textContent='Informe a data de validade.';return}
  for(const d in w){
    if(!w[d])continue;

    if(!!w[d].ls!==!!w[d].lr){err.textContent='Informe saída e retorno do almoço de '+WD[d]+', ou deixe os dois em branco.';return}

  put('cfg',c);

function saveBank(){
  const c=clone(cfg()),m=((+$('#c-h').value||0)*60+(+$('#c-m').value||0))*(+$('#c-sign').value),st=$('#c-start').value,tz=$('#c-tz').value;
  if(!st){toast('Informe o início do controle.');return}

  if(st!==c.start)lg.push({date:now().date,what:'Início do controle alterado',field:'',before:brDate(c.start),after:brDate(st),reason:''});

async function doBackup(){
  const data={app:'meu-ponto',version:1,exportedAt:isoNow(),docs:Store.docs};
  const text=JSON.stringify(data,null,1);
  await saveFile('meu-ponto-backup_'+now().date+'.json',text);
}
async function restore(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Arquivo inválido: não é um backup do Meu Ponto.');return}
  if(!data||data.app!=='meu-ponto'||!data.docs||!data.docs.cfg){toast('Arquivo inválido: não é um backup do Meu Ponto.');return}
  const days=Object.keys(data.docs).filter(k=>k.startsWith('d_')).length;
  if(!await ask('Restaurar backup?','O backup de '+brDateTime(data.exportedAt)+' tem '+days+' dias registrados. Tudo o que está salvo agora será substituído.','Restaurar',true))return;
  for(const id of Object.keys(Store.docs))if(!data.docs[id])drop(id);
  for(const [id,v] of Object.entries(data.docs))put(id,v);
  addLog({date:now().date,what:'Backup restaurado',field:'',before:'',after:days+' dias',reason:'Backup de '+brDateTime(data.exportedAt)});
  render();toast('Backup restaurado.');
}

function vMore(){
  return `<div class="head"><h1>Mais</h1></div>
  <div class="stack">${NAV.slice(4).map(n=>'<a class="card row" style="text-decoration:none;color:var(--navy);font-weight:600;min-height:64px" href="#'+n[0]+'">'+ic(n[2])+n[1]+'</a>').join('')}<button class="btn" data-act="logout">Sair da conta</button></div>`;
}

/* ---------- Lembretes ---------- */
const seenRem=new Set();
let activeRem=null;
function checkReminders(){
  const c=cfg();
  if(!c.remind||!c.remind.on){activeRem=null;return}
  const x=ctx(),d=x.now.date,day=computeDay(d,x);
  if(!day.sched||(day.ev&&ZERO_EXPECTED.includes(day.ev.type))||d!==x.active){activeRem=null;return}
  const p=punchesOf(day.rec);
  activeRem=null;
  for(const k of KEYS){
    if(!day.sched[k]||p[k])continue;
    if((k==='ls'||k==='lr')&&day.rec.noLunch)continue;
    const due=hm2m(day.sched[k])+c.remind.after;
    if(x.now.min>=due&&x.now.min<due+180){
      activeRem={k,t:day.sched[k]};
      const id=d+k;
      if(!seenRem.has(id)){
        seenRem.add(id);
        try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('Meu Ponto',{body:'Registre: '+LABEL[k]+' (previsto '+day.sched[k]+')'})}catch(e){}
      }
    }
    break;
  }
}
function drawReminder(){
  if(!Store.ready)return;
  const el=$('#reminder');
  if(!activeRem||nextKey(ctx().active,computeDay(ctx().active,ctx()))!==activeRem.k){el.innerHTML='';return}
  el.innerHTML='<div class="alert"><span>'+ic('bell')+'<span>Falta registrar <b>'+LABEL[activeRem.k].toLowerCase()+'</b> (previsto às '+activeRem.t+').</span></span><button class="btn sm" data-act="punch" data-key="'+activeRem.k+'">Registrar agora</button></div>';
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='punch')punch(b.dataset.key);
  else if(a==='edit-day')editDay(b.dataset.date);
  else if(a==='close-dlg')$('#dlg').close();
  else if(a==='sel-day'){S.sel=b.dataset.date;render()}
  else if(a==='mon'){
    const [y,m]=S.ym.split('-').map(Number),dt=new Date(Date.UTC(y,m-1+(+b.dataset.d),1));
    S.ym=dt.toISOString().slice(0,7);render();
  }
  else if(a==='cal-today'){const n=now().date;S.ym=n.slice(0,7);S.sel=n;render()}
  else if(a==='go-pend'){S.sel=b.dataset.date;S.ym=b.dataset.date.slice(0,7);location.hash='calendario'}
  else if(a==='no-lunch'){
    const d=b.dataset.date,rec=clone(getDay(d)||{date:d,p:{}});rec.noLunch=true;rec.u=isoNow();put('d_'+d,rec);
    addLog({date:d,what:'Marcado sem almoço',field:'',before:'',after:'',reason:''});render();toast('Ok. O próximo registro será a saída.');
  }
  else if(a==='event-for'){S.evFrom=b.dataset.date;S.evType='dayoff';location.hash='ocorrencias'}
  else if(a==='bank-k'){S.bank.k=b.dataset.k;render()}
  else if(a==='rep-type'){S.rep.type=b.dataset.k;render()}
  else if(a==='pdf')exportPDF();
  else if(a==='xlsx')exportXlsx();
  else if(a==='ev-del')delEvent(b.dataset.id);
  else if(a==='holidays')addHolidays(b.dataset.y);
  else if(a==='save-week')saveWeek();
  else if(a==='save-bank')saveBank();
  else if(a==='save-remind')saveRemind();
  else if(a==='backup')doBackup();
  else if(a==='login-mode')setLoginMode(b.dataset.m);
  else if(a==='logout')logout();
  else if(a==='notif'){try{Notification.requestPermission().then(()=>render())}catch(e){toast('Este ambiente não permite notificações.')}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='edForm')saveEdit();
  else if(e.target.id==='evForm')saveEvent();
  else if(e.target.id==='loginForm')login();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.preview)previewEdit();
  if(t.dataset.week)updateWeekTotal();
  if(S.view==='ajustes')S.dirty=true;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.rep){S.rep[t.dataset.rep]=t.value;render()}
  else if(t.dataset.bank){S.bank[t.dataset.bank]=t.value;render()}
  else if(t.id==='ev-type'){S.evType=t.value;S.evFrom=$('#ev-from').value;render()}
  else if(t.id==='hist-ym'){S.histYm=t.value;render()}
  else if(t.id==='restoreFile'&&t.files[0])restore(t.files[0]);
});
let lastMin=-1,resizeT;
function tick(){
  const n=now(),cl=$('#clock');
  if(cl)cl.innerHTML=n.hm+'<small>:'+n.sec+'</small>';
  if(n.min!==lastMin){lastMin=n.min;checkReminders();if(S.view==='inicio')render(true);else drawReminder()}
}
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(S.view==='banco')drawBankChart()},150)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();flush()}});
$('#brandMark').innerHTML=ic('bank');
route();connect();setInterval(tick,1000);
</script>
</body></html>
